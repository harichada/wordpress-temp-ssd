<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accessoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#accessoryGrad)"/>

  <!-- Mouse -->
  <ellipse cx="320" cy="280" rx="55" ry="75" fill="#2c3e50" opacity="0.9"/>
  <ellipse cx="320" cy="275" rx="50" ry="70" fill="#34495e" opacity="0.8"/>

  <!-- Mouse buttons -->
  <path d="M 295 250 Q 295 210 320 210 L 320 270 Z" fill="#2c3e50" opacity="0.5"/>
  <path d="M 345 250 Q 345 210 320 210 L 320 270 Z" fill="#2c3e50" opacity="0.5"/>

  <!-- Mouse scroll wheel -->
  <rect x="315" y="230" width="10" height="25" rx="5" fill="#3498db" opacity="0.6"/>

  <!-- Keyboard -->
  <rect x="380" y="220" width="280" height="140" rx="10" fill="#2c3e50" opacity="0.9"/>
  <rect x="390" y="230" width="260" height="120" rx="5" fill="#34495e" opacity="0.8"/>

  <!-- Keyboard keys (grid pattern) -->
  <g opacity="0.4">
    <!-- Row 1 -->
    <rect x="400" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="430" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="460" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="490" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="520" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="550" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="580" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="610" y="240" width="25" height="20" rx="2" fill="#95a5a6"/>

    <!-- Row 2 -->
    <rect x="400" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="430" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="460" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="490" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="520" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="550" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="580" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="610" y="265" width="25" height="20" rx="2" fill="#95a5a6"/>

    <!-- Row 3 -->
    <rect x="400" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="430" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="460" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="490" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="520" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="550" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="580" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>
    <rect x="610" y="290" width="25" height="20" rx="2" fill="#95a5a6"/>

    <!-- Spacebar -->
    <rect x="430" y="315" width="175" height="20" rx="2" fill="#95a5a6"/>
  </g>

  <!-- Status LEDs -->
  <circle cx="400" cy="335" r="3" fill="#2ecc71" opacity="0.8"/>
  <circle cx="410" cy="335" r="3" fill="#3498db" opacity="0.6"/>
  <circle cx="420" cy="335" r="3" fill="#e74c3c" opacity="0.4"/>

  <!-- Accessory icon -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="70" text-anchor="middle" opacity="0.3">🖱️</text>

  <!-- Text -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">Premium Accessories</text>
</svg>

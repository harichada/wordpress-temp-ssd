<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#headphoneGrad)"/>

  <!-- Headband -->
  <path d="M 250 200 Q 400 150 550 200" stroke="#2c3e50" stroke-width="20" fill="none" opacity="0.8"/>
  <path d="M 260 205 Q 400 160 540 205" stroke="#34495e" stroke-width="15" fill="none" opacity="0.6"/>

  <!-- Left ear cup -->
  <ellipse cx="250" cy="300" rx="60" ry="80" fill="#2c3e50" opacity="0.9"/>
  <ellipse cx="250" cy="300" rx="45" ry="65" fill="#34495e" opacity="0.8"/>
  <ellipse cx="250" cy="300" rx="35" ry="55" fill="#95a5a6" opacity="0.3"/>

  <!-- Right ear cup -->
  <ellipse cx="550" cy="300" rx="60" ry="80" fill="#2c3e50" opacity="0.9"/>
  <ellipse cx="550" cy="300" rx="45" ry="65" fill="#34495e" opacity="0.8"/>
  <ellipse cx="550" cy="300" rx="35" ry="55" fill="#95a5a6" opacity="0.3"/>

  <!-- Connection arms -->
  <rect x="243" y="200" width="14" height="100" rx="7" fill="#2c3e50" opacity="0.8"/>
  <rect x="543" y="200" width="14" height="100" rx="7" fill="#2c3e50" opacity="0.8"/>

  <!-- Details -->
  <circle cx="250" cy="300" r="8" fill="#3498db" opacity="0.6"/>
  <circle cx="550" cy="300" r="8" fill="#e74c3c" opacity="0.6"/>

  <!-- Headphone icon -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" opacity="0.3">🎧</text>

  <!-- Text -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">Premium Audio</text>
</svg>

<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#laptopGrad)"/>

  <!-- Laptop base -->
  <rect x="100" y="380" width="600" height="15" rx="5" fill="#2c3e50" opacity="0.8"/>

  <!-- Laptop screen -->
  <rect x="150" y="150" width="500" height="320" rx="10" fill="#34495e" opacity="0.9"/>
  <rect x="170" y="170" width="460" height="280" rx="5" fill="#ecf0f1"/>

  <!-- Screen content -->
  <rect x="190" y="190" width="200" height="15" rx="3" fill="#3498db" opacity="0.6"/>
  <rect x="190" y="220" width="150" height="10" rx="2" fill="#95a5a6" opacity="0.4"/>
  <rect x="190" y="240" width="180" height="10" rx="2" fill="#95a5a6" opacity="0.4"/>
  <rect x="190" y="260" width="160" height="10" rx="2" fill="#95a5a6" opacity="0.4"/>

  <!-- Laptop icon -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="80" fill="#3498db" text-anchor="middle" opacity="0.3">💻</text>

  <!-- Camera notch -->
  <circle cx="400" cy="165" r="3" fill="#7f8c8d" opacity="0.5"/>

  <!-- Text -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">Premium Laptops</text>
</svg>

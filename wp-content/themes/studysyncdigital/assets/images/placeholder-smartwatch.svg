<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="watchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#watchGrad)"/>

  <!-- Watch straps -->
  <rect x="360" y="120" width="80" height="100" rx="10" fill="#2c3e50" opacity="0.7"/>
  <rect x="360" y="480" width="80" height="100" rx="10" fill="#2c3e50" opacity="0.7"/>

  <!-- Watch body -->
  <rect x="320" y="220" width="160" height="200" rx="35" fill="#2c3e50" opacity="0.9"/>
  <rect x="330" y="230" width="140" height="180" rx="25" fill="#1a1a1a"/>

  <!-- Screen -->
  <rect x="340" y="240" width="120" height="160" rx="20" fill="#0a0a0a"/>

  <!-- Screen content - time -->
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ff88" text-anchor="middle">10:30</text>

  <!-- Activity rings -->
  <circle cx="400" cy="350" r="35" stroke="#e74c3c" stroke-width="4" fill="none" opacity="0.8" stroke-dasharray="180 220"/>
  <circle cx="400" cy="350" r="28" stroke="#f39c12" stroke-width="4" fill="none" opacity="0.8" stroke-dasharray="150 176"/>
  <circle cx="400" cy="350" r="21" stroke="#2ecc71" stroke-width="4" fill="none" opacity="0.8" stroke-dasharray="120 132"/>

  <!-- Stats -->
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Steps: 8,432</text>

  <!-- Watch icon -->
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="60" text-anchor="middle" opacity="0.3">⌚</text>

  <!-- Text -->
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.7">Smart Wearables</text>
</svg>

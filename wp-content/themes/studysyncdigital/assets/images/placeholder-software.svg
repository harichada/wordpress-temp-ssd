<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="softwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#softwareGrad)"/>

  <!-- App window -->
  <rect x="150" y="100" width="500" height="380" rx="15" fill="#2c3e50" opacity="0.9"/>

  <!-- Window header -->
  <rect x="150" y="100" width="500" height="40" rx="15" fill="#34495e"/>
  <rect x="150" y="120" width="500" height="20" fill="#34495e"/>

  <!-- Window controls -->
  <circle cx="175" cy="120" r="6" fill="#e74c3c" opacity="0.8"/>
  <circle cx="195" cy="120" r="6" fill="#f39c12" opacity="0.8"/>
  <circle cx="215" cy="120" r="6" fill="#2ecc71" opacity="0.8"/>

  <!-- Window title -->
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="14" fill="#ecf0f1" text-anchor="middle">StudySync App</text>

  <!-- Window content area -->
  <rect x="165" y="155" width="470" height="310" rx="8" fill="#ecf0f1"/>

  <!-- Sidebar -->
  <rect x="165" y="155" width="120" height="310" fill="#bdc3c7" opacity="0.3"/>

  <!-- Sidebar items -->
  <rect x="180" y="175" width="90" height="25" rx="5" fill="#3498db" opacity="0.5"/>
  <rect x="180" y="210" width="90" height="25" rx="5" fill="#95a5a6" opacity="0.3"/>
  <rect x="180" y="245" width="90" height="25" rx="5" fill="#95a5a6" opacity="0.3"/>
  <rect x="180" y="280" width="90" height="25" rx="5" fill="#95a5a6" opacity="0.3"/>

  <!-- Main content -->
  <rect x="305" y="175" width="310" height="20" rx="3" fill="#3498db" opacity="0.4"/>
  <rect x="305" y="210" width="250" height="12" rx="2" fill="#95a5a6" opacity="0.3"/>
  <rect x="305" y="235" width="280" height="12" rx="2" fill="#95a5a6" opacity="0.3"/>
  <rect x="305" y="260" width="260" height="12" rx="2" fill="#95a5a6" opacity="0.3"/>

  <!-- Cards -->
  <rect x="305" y="295" width="135" height="90" rx="8" fill="#3498db" opacity="0.2"/>
  <rect x="455" y="295" width="135" height="90" rx="8" fill="#e74c3c" opacity="0.2"/>

  <!-- Software icon -->
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="60" text-anchor="middle" opacity="0.3">⚙️</text>

  <!-- Text -->
  <text x="400" y="565" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.7">Essential Software</text>
</svg>

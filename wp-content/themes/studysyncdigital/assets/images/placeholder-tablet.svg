  <!-- Home button -->
  <circle cx="400" cy="490" r="8" fill="#34495e" opacity="0.3"/>

  <!-- Text -->
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">StudySync Digital</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" opacity="0.7">Perfect Tablets</text>
